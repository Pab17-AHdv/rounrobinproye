<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Torneo Round-Robin Interactivo</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .contenedor { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #007bff; color: white; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; margin-top: 15px; font-size: 16px; width: 100%; }
        button:hover { background-color: #218838; }
        input[type="text"], input[type="number"] { padding: 10px; margin-bottom: 10px; width: 95%; border: 1px solid #ccc; border-radius: 4px; }
        .partido { margin-bottom: 10px; padding: 10px; background-color: #e9ecef; border-radius: 5px; }
        select { padding: 8px; width: 100%; margin-top: 5px; border-radius: 4px; }
        .oculto { display: none; } /* Esta clase es la magia para ir ocultando los pasos */
    </style>
</head>
<body>

<div class="contenedor">
    
    <!-- FASE 1: CANTIDAD DE PARTICIPANTES -->
    <div id="fase1">
        <h2>Paso 1: Participantes</h2>
        <p>¿Cuántos jugadores participarán en el torneo?</p>
        <!-- Aquí está el 8 por defecto que pediste -->
        <input type="number" id="cantidad_N" value="8" min="2" max="20">
        <button onclick="irFase2()">Siguiente: Ingresar Nombres</button>
    </div>

    <!-- FASE 2: INGRESAR NOMBRES UNO POR UNO -->
    <div id="fase2" class="oculto">
        <h2>Paso 2: Nombres</h2>
        <p>Ingresa el nombre de cada participante:</p>
        <!-- Aquí se inyectarán los inputs dependiendo de lo que el usuario eligió arriba -->
        <div id="inputs_nombres"></div>
        <button onclick="irFase3()">Siguiente: Enfrentamientos</button>
    </div>

    <!-- FASE 3: ¿QUIÉN LE GANÓ A QUIÉN? -->
    <div id="fase3" class="oculto">
        <h2>Paso 3: Resultados de Partidos</h2>
        <p>Selecciona 1 si el primer jugador ganó, o 0 si perdió.</p>
        <!-- Aquí se inyectan las preguntas generadas por el ciclo i < j -->
        <div id="inputs_partidos"></div>
        <button onclick="calcularTorneo()">Calcular Ganador</button>
    </div>

    <!-- FASE 4: RESULTADOS -->
    <div id="fase4" class="oculto">
        <div id="tabla_resultados"></div>
        <button onclick="location.reload()" style="background-color: #007bff;">Reiniciar Torneo</button>
    </div>

</div>

<script>
// Variables globales equivalentes a tu C++
let N = 8;
let nombres = [];

// Función para pasar a la Fase 2 (Nombres)
function irFase2() {
    N = parseInt(document.getElementById("cantidad_N").value); // Lee el número ingresado
    let html = "";
    
    // Ciclo for equivalente al que usabas en C++ para pedir nombres
    for(let i = 0; i < N; i++) {
        html += `<label>Participante ${i + 1}:</label><br>`;
        html += `<input type="text" id="nombre_${i}" placeholder="Nombre del jugador ${i+1}"><br>`;
    }
    
    document.getElementById("inputs_nombres").innerHTML = html;
    document.getElementById("fase1").classList.add("oculto"); // Oculta la fase 1
    document.getElementById("fase2").classList.remove("oculto"); // Muestra la fase 2
}

// Función para pasar a la Fase 3 (Enfrentamientos)
function irFase3() {
    nombres = [];
    // Guardamos los nombres que escribió el usuario
    for(let i = 0; i < N; i++) {
        let nom = document.getElementById(`nombre_${i}`).value;
        if (nom.trim() === "") nom = `Jugador ${i+1}`; // Por si deja uno en blanco
        nombres.push(nom);
    }

    let html = "";
    // Ciclo for equivalente a tu "i < j" en C++ para evitar repetidos
    for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
            html += `
            <div class="partido">
                ¿<strong>${nombres[i]}</strong> venció a <strong>${nombres[j]}</strong>?<br>
                <select id="partido_${i}_${j}">
                    <option value="1">1 = Sí (Ganó ${nombres[i]})</option>
                    <option value="0">0 = No (Ganó ${nombres[j]})</option>
                </select>
            </div>`;
        }
    }
    
    document.getElementById("inputs_partidos").innerHTML = html;
    document.getElementById("fase2").classList.add("oculto"); // Oculta fase 2
    document.getElementById("fase3").classList.remove("oculto"); // Muestra fase 3
}

// Fase 4: La lógica matemática original de tu C++
function calcularTorneo() {
    // Declaración de matrices
    let MR = Array.from({length: N}, () => Array(N).fill(0));
    let MR_Cuadrado = Array.from({length: N}, () => Array(N).fill(0));
    let vic_directas = Array(N).fill(0);
    let vic_indirectas = Array(N).fill(0);
    let puntaje_total = Array(N).fill(0);

    // Llenado de matriz MR
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
            if (i === j) {
                MR[i][j] = 0; 
            } else if (i < j) {
                let resultado = parseInt(document.getElementById(`partido_${i}_${j}`).value);
                MR[i][j] = resultado;
                MR[j][i] = (resultado === 1) ? 0 : 1; 
            }
        }
    }

    // Multiplicación de Matrices: MR * MR = MR_Cuadrado
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
            for (let k = 0; k < N; k++) {
                MR_Cuadrado[i][j] += MR[i][k] * MR[k][j]; 
            }
        }
    }

    // Sumar filas
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
            vic_directas[i] += MR[i][j];
            vic_indirectas[i] += MR_Cuadrado[i][j];
        }
        puntaje_total[i] = vic_directas[i] + vic_indirectas[i];
    }

    // Calcular ganador y armar la tabla final
    let max_puntaje = -1;
    let indice_ganador = -1;
    
    let htmlSalida = "<h2>=== TABLA FINAL DE RESULTADOS ===</h2>";
    htmlSalida += "<table><tr><th>Nombre</th><th>Directas</th><th>Indirectas</th><th>Puntaje Total</th></tr>";

    for (let i = 0; i < N; i++) {
        htmlSalida += `<tr>
                          <td>${nombres[i]}</td>
                          <td>${vic_directas[i]}</td>
                          <td>${vic_indirectas[i]}</td>
                          <td><strong>${puntaje_total[i]}</strong></td>
                       </tr>`;

        if (puntaje_total[i] > max_puntaje) {
            max_puntaje = puntaje_total[i];
            indice_ganador = i;
        }
    }
    htmlSalida += "</table>";
    htmlSalida += `<h2 style="color: red; text-align: center;">¡EL GANADOR ES: ${nombres[indice_ganador]}!</h2>`;

    // Mostrar tabla final
    document.getElementById("tabla_resultados").innerHTML = htmlSalida;
    document.getElementById("fase3").classList.add("oculto"); // Oculta fase 3
    document.getElementById("fase4").classList.remove("oculto"); // Muestra Resultados
}
</script>

</body>
</html>
