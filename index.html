<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Torneo Round-Robin Interactivo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="contenedor">
        <!-- FASE 1: CANTIDAD DE PARTICIPANTES -->
    <div id="fase1">
        <h2>Paso 1: Participantes</h2>
        <p>¿Cuántos jugadores participarán en el torneo?</p>
        <!-- Actualizamos min a 4, max a 16 y agregamos el evento oninput -->
        <input type="number" id="cantidad_N" value="8" min="4" max="16" oninput="actualizarModo()">
        
        <!-- Etiqueta dinámica para el modo -->
        <div id="info_modo" style="margin: 8px 0; font-size: 14px; color: #555;">
            <strong>Modo Estándar:</strong> Configuración recomendada por defecto.
        </div>

        <button onclick="irFase2()">Siguiente: Ingresar Nombres</button>
    </div>

    <!-- FASE 2: INGRESAR NOMBRES UNO POR UNO -->
    <div id="fase2" class="oculto">
        <h2>Paso 2: Nombres</h2>
        <p>Ingresa el nombre de cada participante:</p>
        <div id="inputs_nombres"></div>
        <button onclick="irFase3()">Siguiente: Enfrentamientos</button>
    </div>

    <!-- FASE 3: ¿QUIÉN LE GANÓ A QUIÉN? -->
    <div id="fase3" class="oculto">
        <h2>Paso 3: Resultados de Partidos</h2>
        <p>Selecciona 1 si el primer jugador ganó, o 0 si perdió.</p>
        <div id="inputs_partidos"></div>
        <button onclick="calcularTorneo()">Calcular Ganador</button>
    </div>

    <!-- FASE 4: RESULTADOS -->
    <div id="fase4" class="oculto">
        <div id="tabla_resultados"></div>
        <button onclick="location.reload()" style="background-color: #f3a744;">Reiniciar Torneo</button>
    </div>

</div>

<script type="module" src="script.js"></script>

<div id="gridFragmentado" class="transicion-fragmentada"></div>
</body>
</html>
